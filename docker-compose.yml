services:
  app:
    build: .
    container_name: anon_app
    env_file:
      - .env
    ports:
      - "8000:8000"

  nginx:
    image: ghcr.io/nginxinc/nginx:1.27-alpine
    container_name: anon_nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
