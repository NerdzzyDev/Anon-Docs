services:
  app:
    build: .
    container_name: anon_app
    env_file:
      - .env
    environment:
      LLM_ENABLED: "1"
      LLM_PROVIDER: "ollama"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3"
    ports:
      - "8000:8000"
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    container_name: anon_ollama
    ports:
      - "11888:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
