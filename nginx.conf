worker_processes 1;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  upstream anon_backend {
    server app:8000;
  }

  server {
    listen 80;
    server_name anon-docs.duckdns.org;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name anon-docs.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/anon-docs.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anon-docs.duckdns.org/privkey.pem;

    location / {
      proxy_pass http://anon_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
